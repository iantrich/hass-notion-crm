name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The domain logic works in calendar days, so results must not depend
      # on the machine's zone. A zone far from UTC catches regressions.
      - run: npm test
        env:
          TZ: Pacific/Kiritimati
